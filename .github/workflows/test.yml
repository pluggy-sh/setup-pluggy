name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: ${{ matrix.os }} / pluggy@${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          pluggy-version: ${{ matrix.version }}
          cache: false
      - run: pluggy --version
        shell: bash

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
